<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Competitive Kitchen — weekly food planner. Tell it what you want to eat, what you already have, and your budget. It builds a plan, finds the best prices, and tells you where to shop."
    />
    <meta name="theme-color" content="#140e0c" />
    <title>Competitive Kitchen</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <p class="kicker">Weekly food planner</p>
        <h1>Competitive Kitchen</h1>
        <ol id="steps" class="steps" aria-label="Planner steps"></ol>
      </header>

      <section id="view-week" class="view"></section>
      <section id="view-eat" class="view" hidden></section>
      <section id="view-pantry" class="view" hidden></section>
      <section id="view-plan" class="view" hidden></section>
      <section id="view-shop" class="view" hidden></section>
    </div>
    <script src="data.js"></script>
    <script src="planner.js"></script>
    <script src="app.js"></script>
  </body>
</html>
